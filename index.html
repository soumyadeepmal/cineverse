<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07070d">
<title>CineVerse — Movies · Anime · Series</title>
<style>
  :root{
    --bg:#07070d; --bg2:#0d0d17; --card:#12121e; --line:rgba(255,255,255,.07);
    --txt:#f2f2f8; --dim:#9a9ab0; --acc:#8b5cf6; --acc2:#22d3ee; --gold:#fbbf24;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       padding-bottom:76px;min-height:100vh}
  ::-webkit-scrollbar{display:none}

  /* header */
  header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
    padding:14px 16px;background:rgba(7,7,13,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .logo{font-size:22px;font-weight:900;letter-spacing:.5px;
    background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo span{color:var(--txt);-webkit-text-fill-color:var(--txt)}
  .hbtns{margin-left:auto;display:flex;gap:8px}
  .iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);
    color:var(--txt);font-size:17px;display:grid;place-items:center;cursor:pointer}

  /* search */
  .searchwrap{display:none;padding:12px 16px 4px}
  .searchwrap.open{display:block}
  .searchwrap input{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--line);
    background:var(--card);color:var(--txt);font-size:15px;outline:none}
  .searchwrap input:focus{border-color:var(--acc)}

  /* hero */
  .hero{margin:14px 16px 6px;border-radius:22px;overflow:hidden;position:relative;min-height:210px;
    display:flex;align-items:flex-end;border:1px solid var(--line)}
  .hero .art{position:absolute;inset:0}
  .hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,rgba(0,0,0,.88))}
  .hero .meta{position:relative;padding:18px;width:100%}
  .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
    padding:4px 10px;border-radius:20px;background:rgba(139,92,246,.25);border:1px solid rgba(139,92,246,.5);color:#d6c8ff;margin-bottom:8px}
  .hero h2{font-size:24px;font-weight:900;line-height:1.15;text-shadow:0 2px 12px rgba(0,0,0,.6)}
  .hero p{color:#c9c9dd;font-size:13px;margin:6px 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .btnrow{display:flex;gap:10px}
  .btn{padding:10px 18px;border-radius:12px;font-weight:800;font-size:13px;border:none;cursor:pointer}
  .btn-p{background:linear-gradient(90deg,var(--acc),#6d28d9);color:#fff}
  .btn-g{background:rgba(255,255,255,.12);color:#fff;border:1px solid var(--line)}

  /* section rows */
  section{margin-top:22px}
  .rowhead{display:flex;align-items:baseline;padding:0 16px;margin-bottom:10px}
  .rowhead h3{font-size:17px;font-weight:800}
  .rowhead small{margin-left:auto;color:var(--dim);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
  .rail{display:flex;gap:12px;overflow-x:auto;padding:2px 16px 8px;scroll-snap-type:x mandatory}
  .card{flex:0 0 132px;scroll-snap-align:start;cursor:pointer}
  .poster{position:relative;width:132px;height:190px;border-radius:16px;overflow:hidden;border:1px solid var(--line);
    display:flex;flex-direction:column;justify-content:flex-end;padding:10px;transition:transform .15s}
  .card:active .poster{transform:scale(.96)}
  .poster .pt{font-weight:900;font-size:14px;line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.7)}
  .poster .rate{position:absolute;top:8px;left:8px;font-size:10px;font-weight:800;color:#000;
    background:var(--gold);padding:3px 7px;border-radius:8px}
  .poster .kind{position:absolute;top:8px;right:8px;font-size:9px;font-weight:800;letter-spacing:.5px;
    background:rgba(0,0,0,.55);padding:3px 7px;border-radius:8px;color:#fff;text-transform:uppercase}
  .card .cy{color:var(--dim);font-size:11px;margin-top:6px;font-weight:600}

  /* grid for category views */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:4px 16px}
  .grid .card{flex:none;width:100%}
  .grid .poster{width:100%;height:0;padding-top:144%}
  .grid .poster .in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:10px}

  /* detail modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:60;display:none;align-items:flex-end;backdrop-filter:blur(3px)}
  .overlay.open{display:flex}
  .sheet{background:var(--bg2);width:100%;max-height:88vh;overflow-y:auto;border-radius:24px 24px 0 0;
    border-top:1px solid var(--line);animation:up .22s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  .sheet .banner{height:170px;position:relative;display:flex;align-items:flex-end;padding:16px}
  .sheet .banner h2{font-size:24px;font-weight:900;text-shadow:0 2px 10px rgba(0,0,0,.8);position:relative}
  .sheet .banner .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(13,13,23,1))}
  .sheet .body{padding:16px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
  .chip{font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--dim)}
  .syn{color:#c5c5da;font-size:14px;line-height:1.6}
  .sheet .btnrow{margin-top:16px}
  .grab{width:44px;height:5px;border-radius:5px;background:rgba(255,255,255,.18);margin:10px auto 0}
  .closex{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:none;
    background:rgba(0,0,0,.55);color:#fff;font-size:15px;cursor:pointer;z-index:2}

  /* admin */
  .form label{display:block;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
  .form input,.form select,.form textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);color:var(--txt);font-size:14px;outline:none;font-family:inherit}
  .form textarea{min-height:80px;resize:vertical}
  .form input:focus,.form select:focus,.form textarea:focus{border-color:var(--acc)}
  .formrow{display:flex;gap:10px}.formrow>div{flex:1}
  .adminitem{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;margin-top:8px;font-size:13px}
  .adminitem b{flex:1}
  .mini{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:#f87171;font-size:12px;cursor:pointer}
  .note{font-size:12px;color:var(--dim);line-height:1.5;margin-top:14px}

  /* bottom nav */
  nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;background:rgba(10,10,16,.92);
    backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
  nav button{flex:1;background:none;border:none;color:var(--dim);font-size:10px;font-weight:700;
    display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px}
  nav button .ic{font-size:19px}
  nav button.on{color:var(--txt)}
  nav button.on .ic{filter:drop-shadow(0 0 8px var(--acc))}

  footer{text-align:center;color:var(--dim);font-size:12px;padding:28px 16px 12px;line-height:1.7}
  footer b{color:var(--txt)}
  .empty{color:var(--dim);text-align:center;padding:40px 20px;font-size:14px}
  .toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#1c1c2e;border:1px solid var(--acc);
    color:var(--txt);padding:10px 18px;border-radius:30px;font-size:13px;font-weight:700;z-index:80;display:none}
</style>
</head>
<body>

<header>
  <div class="logo">CINE<span>VERSE</span></div>
  <div class="hbtns">
    <button class="iconbtn" id="searchBtn" title="Search">🔍</button>
    <button class="iconbtn" id="adminBtn" title="Add your titles">＋</button>
  </div>
</header>

<div class="searchwrap" id="searchWrap">
  <input id="searchInput" type="search" placeholder="Search movies, anime, series…" autocomplete="off">
</div>

<main id="app"></main>

<footer>
  Your universe of <b>movies</b>, <b>anime</b> &amp; <b>series</b> — all in one place.<br>
  made by <b>Soumyadeep</b> 🖤
</footer>

<nav>
  <button data-v="home" class="on"><span class="ic">🏠</span>Home</button>
  <button data-v="movie"><span class="ic">🎬</span>Movies</button>
  <button data-v="anime"><span class="ic">⛩️</span>Anime</button>
  <button data-v="series"><span class="ic">📺</span>Series</button>
  <button data-v="mylist"><span class="ic">❤️</span>My List</button>
</nav>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- data ---------------- */
/* Seed library. Owner-added titles live in localStorage and merge on top of this list. */
const SEED=[
 {id:"m1",type:"movie",title:"Interstellar",year:2014,genre:"Sci-Fi",rating:8.7,hue:230,syn:"A team of explorers travels through a wormhole in space in an attempt to ensure humanity's survival as Earth becomes uninhabitable."},
 {id:"m2",type:"movie",title:"Inception",year:2010,genre:"Sci-Fi Thriller",rating:8.8,hue:265,syn:"A skilled thief who steals secrets from deep within the subconscious is given one last job: plant an idea inside a target's mind."},
 {id:"m3",type:"movie",title:"The Dark Knight",year:2008,genre:"Action",rating:9.0,hue:210,syn:"Batman faces the Joker, a criminal mastermind who plunges Gotham into chaos and forces the Dark Knight to cross his own lines."},
 {id:"m4",type:"movie",title:"Dune: Part Two",year:2024,genre:"Epic Sci-Fi",rating:8.5,hue:30,syn:"Paul Atreides unites with the Fremen and wages war against House Harkonnen, torn between love and the fate of the universe."},
 {id:"m5",type:"movie",title:"Oppenheimer",year:2023,genre:"Biography",rating:8.3,hue:20,syn:"The story of J. Robert Oppenheimer and the creation of the atomic bomb, and the moral weight that came with it."},
 {id:"m6",type:"movie",title:"Spider-Man: Across the Spider-Verse",year:2023,genre:"Animation",rating:8.6,hue:350,syn:"Miles Morales catapults across the Multiverse, meeting a team of Spider-People and redefining what it means to be a hero."},
 {id:"a1",type:"anime",title:"Jujutsu Kaisen",year:2020,genre:"Action · Supernatural",rating:8.7,hue:160,syn:"Yuji Itadori swallows a cursed finger and enters a hidden world of sorcerers battling deadly curses."},
 {id:"a2",type:"anime",title:"Demon Slayer",year:2019,genre:"Action · Fantasy",rating:8.7,hue:0,syn:"Tanjiro becomes a demon slayer to avenge his family and cure his sister Nezuko, who was turned into a demon."},
 {id:"a3",type:"anime",title:"Attack on Titan",year:2013,genre:"Dark Fantasy",rating:9.1,hue:45,syn:"Humanity fights for survival behind giant walls against man-eating Titans — until the truth behind them shatters everything."},
 {id:"a4",type:"anime",title:"One Piece",year:1999,genre:"Adventure",rating:9.0,hue:200,syn:"Monkey D. Luffy and his crew sail the Grand Line in search of the legendary One Piece to make him the Pirate King."},
 {id:"a5",type:"anime",title:"Solo Leveling",year:2024,genre:"Action · Fantasy",rating:8.4,hue:280,syn:"The weakest hunter, Sung Jinwoo, gains a mysterious power to level up without limits and rises to become the strongest."},
 {id:"a6",type:"anime",title:"Frieren: Beyond Journey's End",year:2023,genre:"Fantasy",rating:9.3,hue:150,syn:"An elven mage outlives her hero party and journeys on, discovering what their time together truly meant."},
 {id:"s1",type:"series",title:"Breaking Bad",year:2008,genre:"Crime Drama",rating:9.5,hue:120,syn:"A chemistry teacher diagnosed with cancer turns to cooking meth, slowly transforming into a ruthless kingpin."},
 {id:"s2",type:"series",title:"Stranger Things",year:2016,genre:"Sci-Fi Horror",rating:8.7,hue:340,syn:"A group of kids in Hawkins faces a parallel dimension, the Upside Down, after their friend vanishes."},
 {id:"s3",type:"series",title:"The Last of Us",year:2023,genre:"Post-Apocalyptic",rating:8.8,hue:90,syn:"A hardened smuggler escorts a girl who may be humanity's last hope across a brutal, infected America."},
 {id:"s4",type:"series",title:"Money Heist",year:2017,genre:"Heist Thriller",rating:8.2,hue:355,syn:"The Professor recruits eight thieves to pull off the most ambitious heists in Spain's history."},
 {id:"s5",type:"series",title:"Wednesday",year:2022,genre:"Mystery",rating:8.5,hue:300,syn:"Wednesday Addams investigates a monstrous mystery at Nevermore Academy while mastering her psychic powers."},
 {id:"s6",type:"series",title:"Loki",year:2021,genre:"Superhero",rating:8.2,hue:140,syn:"The God of Mischief is pulled into the Time Variance Authority to fix the broken timeline he created."}
];

const $=s=>document.querySelector(s);
const KIND={movie:"Movie",anime:"Anime",series:"Series"};

/* ---------------- store ---------------- */
const Store={
  custom(){try{return JSON.parse(localStorage.getItem("cv-custom")||"[]")}catch(e){return[]}},
  saveCustom(l){localStorage.setItem("cv-custom",JSON.stringify(l))},
  list(){try{return JSON.parse(localStorage.getItem("cv-list")||"[]")}catch(e){return[]}},
  saveList(l){localStorage.setItem("cv-list",JSON.stringify(l))},
  all(){return SEED.concat(Store.custom())},
  byId(id){return Store.all().find(t=>t.id===id)}
};

/* ---------------- render helpers ---------------- */
function grad(t){return "linear-gradient(160deg,hsl("+t.hue+",65%,26%),hsl("+((t.hue+45)%360)+",70%,9%))"}
function posterInner(t){
  return '<div class="rate">★ '+t.rating+'</div><div class="kind">'+KIND[t.type]+'</div>'+
         '<div class="pt">'+esc(t.title)+'</div>';
}
function cardHTML(t){
  return '<div class="card" onclick="openDetail(\''+t.id+'\')">'+
    '<div class="poster" style="background:'+grad(t)+'">'+posterInner(t)+'</div>'+
    '<div class="cy">'+t.year+' · '+esc(t.genre)+'</div></div>';
}
function gridCardHTML(t){
  return '<div class="card" onclick="openDetail(\''+t.id+'\')">'+
    '<div class="poster" style="background:'+grad(t)+'"><div class="in">'+posterInner(t)+'</div></div>'+
    '<div class="cy">'+t.year+'</div></div>';
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* ---------------- views ---------------- */
let view="home", query="";

function render(){
  const app=$("#app");
  if(query){return renderSearch(app)}
  if(view==="home")return renderHome(app);
  if(view==="mylist")return renderMyList(app);
  return renderGrid(app,view);
}

function renderHome(app){
  const all=Store.all();
  const top=all.slice().sort((a,b)=>b.rating-a.rating);
  const hero=top[0];
  const rows=[
    ["Trending Now","hot",top.slice(0,10)],
    ["Movies","🎬",all.filter(t=>t.type==="movie")],
    ["Anime","⛩️",all.filter(t=>t.type==="anime")],
    ["Series","📺",all.filter(t=>t.type==="series")]
  ];
  let h='<div class="hero" style="background:'+grad(hero)+'" onclick="openDetail(\''+hero.id+'\')">'+
    '<div class="shade"></div><div class="meta"><span class="tag">★ '+hero.rating+' · Top Rated</span>'+
    '<h2>'+esc(hero.title)+'</h2><p>'+esc(hero.syn)+'</p>'+
    '<div class="btnrow"><button class="btn btn-p">▶ Details</button></div></div></div>';
  for(const [name,ic,items] of rows){
    if(!items.length)continue;
    h+='<section><div class="rowhead"><h3>'+ic+' '+name+'</h3><small>'+items.length+' titles</small></div>'+
       '<div class="rail">'+items.map(cardHTML).join("")+'</div></section>';
  }
  app.innerHTML=h;
}

function renderGrid(app,type){
  const items=Store.all().filter(t=>t.type===type).sort((a,b)=>b.rating-a.rating);
  app.innerHTML='<section><div class="rowhead"><h3>'+KIND[type]+'</h3><small>'+items.length+' titles</small></div>'+
    (items.length?'<div class="grid">'+items.map(gridCardHTML).join("")+'</div>'
                 :'<div class="empty">Nothing here yet.<br>Tap ＋ above to add your first '+KIND[type].toLowerCase()+'.</div>')+'</section>';
}

function renderMyList(app){
  const ids=Store.list();
  const items=ids.map(Store.byId).filter(Boolean);
  app.innerHTML='<section><div class="rowhead"><h3>❤️ My List</h3><small>'+items.length+' saved</small></div>'+
    (items.length?'<div class="grid">'+items.map(gridCardHTML).join("")+'</div>'
                 :'<div class="empty">Your list is empty.<br>Open any title and tap <b>＋ My List</b>.</div>')+'</section>';
}

function renderSearch(app){
  const q=query.toLowerCase();
  const items=Store.all().filter(t=>(t.title+" "+t.genre+" "+KIND[t.type]).toLowerCase().includes(q));
  app.innerHTML='<section><div class="rowhead"><h3>Results for “'+esc(query)+'”</h3><small>'+items.length+'</small></div>'+
    (items.length?'<div class="grid">'+items.map(gridCardHTML).join("")+'</div>'
                 :'<div class="empty">No match found.</div>')+'</section>';
}

/* ---------------- detail ---------------- */
function openDetail(id){
  const t=Store.byId(id); if(!t)return;
  const inList=Store.list().includes(id);
  const yt="https://www.youtube.com/results?search_query="+encodeURIComponent(t.title+" trailer");
  $("#sheet").innerHTML=
    '<div class="grab"></div>'+
    '<div class="banner" style="background:'+grad(t)+'"><div class="shade"></div>'+
      '<button class="closex" onclick="closeSheet()">✕</button><h2>'+esc(t.title)+'</h2></div>'+
    '<div class="body"><div class="chips">'+
      '<span class="chip">'+KIND[t.type]+'</span><span class="chip">'+t.year+'</span>'+
      '<span class="chip">'+esc(t.genre)+'</span><span class="chip" style="color:var(--gold)">★ '+t.rating+'</span></div>'+
    '<p class="syn">'+esc(t.syn)+'</p>'+
    '<div class="btnrow">'+
      '<button class="btn btn-p" onclick="toggleList(\''+t.id+'\')">'+(inList?"✓ In My List":"＋ My List")+'</button>'+
      '<button class="btn btn-g" onclick="window.open(\''+yt+'\',\'_blank\')">▶ Trailer</button>'+
    '</div></div>';
  $("#overlay").classList.add("open");
  document.body.style.overflow="hidden";
}
function closeSheet(){$("#overlay").classList.remove("open");document.body.style.overflow="";if(view==="mylist")render()}
function toggleList(id){
  let l=Store.list();
  if(l.includes(id)){l=l.filter(x=>x!==id);toast("Removed from My List")}
  else{l.push(id);toast("Added to My List ❤️")}
  Store.saveList(l);openDetail(id);
}

/* ---------------- admin ---------------- */
function openAdmin(){
  const items=Store.custom();
  $("#sheet").innerHTML=
    '<div class="grab"></div><div class="body" style="padding-top:22px">'+
    '<button class="closex" style="position:fixed" onclick="closeSheet()">✕</button>'+
    '<h2 style="font-size:20px;font-weight:900">Add Your Title</h2>'+
    '<div class="form">'+
      '<label>Title</label><input id="f-title" placeholder="e.g. Your favourite movie">'+
      '<div class="formrow"><div><label>Type</label><select id="f-type">'+
        '<option value="movie">Movie</option><option value="anime">Anime</option><option value="series">Series</option>'+
      '</select></div>'+
      '<div><label>Year</label><input id="f-year" type="number" placeholder="2024" min="1900" max="2100"></div></div>'+
      '<div class="formrow"><div><label>Genre</label><input id="f-genre" placeholder="Action"></div>'+
      '<div><label>Rating (0-10)</label><input id="f-rating" type="number" step="0.1" min="0" max="10" placeholder="8.5"></div></div>'+
      '<label>Synopsis</label><textarea id="f-syn" placeholder="Short description…"></textarea>'+
      '<label>Poster colour (hue 0-360)</label><input id="f-hue" type="number" min="0" max="360" placeholder="265">'+
      '<div class="btnrow" style="margin-top:16px"><button class="btn btn-p" style="flex:1" onclick="addTitle()">Save Title</button></div>'+
      '<div class="note">Titles you add are saved on this device and appear instantly in the app.<br>'+
      'Use Export to back them up or move them to another device.</div>'+
      '<div class="btnrow" style="margin-top:12px">'+
        '<button class="btn btn-g" style="flex:1" onclick="exportData()">⬇ Export</button>'+
        '<button class="btn btn-g" style="flex:1" onclick="importData()">⬆ Import</button>'+
      '</div>'+
      '<div id="customList">'+(items.length?
        '<label style="display:block;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin:18px 0 4px">Your added titles</label>'+
        items.map(t=>'<div class="adminitem"><b>'+esc(t.title)+'</b><span style="color:var(--dim)">'+KIND[t.type]+'</span>'+
          '<button class="mini" onclick="delTitle(\''+t.id+'\')">Delete</button></div>').join("")
        :"")+'</div>'+
    '</div></div>';
  $("#overlay").classList.add("open");
  document.body.style.overflow="hidden";
}
function addTitle(){
  const title=$("#f-title").value.trim();
  if(!title){toast("Title likhna zaroori hai 🙂");return}
  const t={
    id:"u"+Date.now(),
    type:$("#f-type").value,
    title:title,
    year:parseInt($("#f-year").value)||new Date().getFullYear(),
    genre:$("#f-genre").value.trim()||"Other",
    rating:Math.min(10,Math.max(0,parseFloat($("#f-rating").value)||7)),
    hue:Math.min(360,Math.max(0,parseInt($("#f-hue").value)||Math.floor(Math.random()*360))),
    syn:$("#f-syn").value.trim()||"Added by Soumyadeep."
  };
  const l=Store.custom();l.push(t);Store.saveCustom(l);
  toast("Saved ✔");openAdmin();render();
}
function delTitle(id){
  Store.saveCustom(Store.custom().filter(t=>t.id!==id));
  Store.saveList(Store.list().filter(x=>x!==id));
  toast("Deleted");openAdmin();render();
}
function exportData(){
  const blob=new Blob([JSON.stringify(Store.custom(),null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="cineverse-backup.json";a.click();
  toast("Backup downloaded ⬇");
}
function importData(){
  const inp=document.createElement("input");inp.type="file";inp.accept=".json";
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{const arr=JSON.parse(r.result);
      if(!Array.isArray(arr))throw 0;
      const ok=arr.filter(t=>t&&t.title&&t.type);
      Store.saveCustom(Store.custom().concat(ok));
      toast("Imported "+ok.length+" titles ✔");openAdmin();render();
    }catch(e){toast("File samajh nahi aaya ❌")}};
    r.readAsText(f)};
  inp.click();
}

/* ---------------- wiring ---------------- */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  view=b.dataset.v;query="";$("#searchInput").value="";$("#searchWrap").classList.remove("open");
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  window.scrollTo(0,0);render();
});
$("#searchBtn").onclick=()=>{
  const w=$("#searchWrap");w.classList.toggle("open");
  if(w.classList.contains("open"))$("#searchInput").focus();
  else{query="";$("#searchInput").value="";render()}
};
$("#searchInput").oninput=e=>{query=e.target.value.trim();render()};
$("#adminBtn").onclick=openAdmin;
$("#overlay").onclick=e=>{if(e.target.id==="overlay")closeSheet()};
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";
  clearTimeout(t._x);t._x=setTimeout(()=>t.style.display="none",1800)}

render();
</script>
</body>
</html>
